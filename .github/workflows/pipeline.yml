# Same four stages as .gitlab-ci.yml, so the evaluation runs on either platform.
name: 90/10 for Pipelines
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Reproduce every failure
        run: for s in scenarios/*/; do python harness/ci.py "$s" --out runs/reproduction || exit 1; done
      - name: Prove every answer key
        run: python harness/verify_fixes.py
      - name: Score agent runs
        run: for r in runs/*/; do [ -d "$r/responses" ] && python harness/score.py "$r"; done; true
      - name: Build results page
        run: python harness/build_site.py --out public
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
  deploy:
    needs: evaluate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
